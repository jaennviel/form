<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore FORM Designer Archive: distinctive silhouettes, unexpected materials and considered construction.">
  <meta name="theme-color" content="#ffffff">
  <title>Designer Archive | FORM</title>
  <!-- EXTERNAL CSS: shared layout, typography, navigation, footer and responsive cards. -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="icon" href="images/brand/favicon.svg" type="image/svg+xml" sizes="any">
  <link rel="apple-touch-icon" href="images/brand/apple-touch-icon.png" sizes="180x180">
  <link rel="preload" href="fonts/BebasNeue-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <!-- INTERNAL CSS: an image-led editorial layout unique to the homepage.
       Shared typography, colors, navigation, footer and focus remain external. -->
  <style>
    .home-hero { display: grid; grid-template-columns: minmax(0, 1fr); }
    .home-hero .hero-image { background: var(--bg); }
    .home-hero .hero-image img { height: auto; aspect-ratio: 16 / 9; object-fit: cover; }
    .home-hero .image-credit { padding: 0.75rem 0 0; }
    .home-hero .hero-copy {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      column-gap: 2rem;
      padding: 2rem 0 0;
    }
    .home-hero .hero-copy h1 { grid-column: 1; margin-bottom: 0.5rem; font-size: clamp(3rem, 2rem + 3vw, 5rem); }
    .home-hero .brand-tagline { grid-column: 1; margin-bottom: 0; }
    .home-hero .hero-collection-link { grid-column: 2; grid-row: 1 / 3; align-self: end; }
    .home-intro { max-width: 42rem; margin: 3rem 0 5rem; }
    @media (max-width: 600px) {
      .home-hero .hero-image img { aspect-ratio: 4 / 3; }
      .home-hero .hero-copy { grid-template-columns: minmax(0, 1fr); padding-top: 1.5rem; }
      .home-hero .hero-collection-link { grid-column: 1; grid-row: auto; justify-self: start; margin-top: 0.75rem; }
      .home-intro { margin-block: 2rem 3rem; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header"><div class="wrap header-inner">
    <a class="brand" href="index.html" aria-label="FORM home" translate="no"><img class="brand-logo" src="images/brand/logo-wordmark-dark.svg" alt="FORM" width="240" height="64"></a>
    <!-- HTML popover supplies mobile open/close and Escape without JavaScript. -->
    <button class="mobile-menu-toggle" type="button" popovertarget="main-navigation" aria-label="Open navigation">
      <svg width="28" height="24" viewBox="0 0 28 24" fill="currentColor" aria-hidden="true" focusable="false"><circle cx="5" cy="12" r="2"></circle><circle cx="14" cy="12" r="2"></circle><circle cx="23" cy="12" r="2"></circle></svg>
    </button>
    <nav class="main-nav" id="main-navigation" aria-label="Main navigation" popover="auto">
        <button class="mobile-menu-close" type="button" popovertarget="main-navigation" popovertargetaction="hide" aria-label="Close navigation">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false"><path d="m5 5 14 14M19 5 5 19"></path></svg>
        </button>
        <a href="index.html" aria-current="page">Home</a>
        <a href="category-1.html">Collection</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
  </div></header>
  <main id="main" tabindex="-1">
    <div class="wrap">
      <section class="home-hero" aria-labelledby="hero-title">
        <figure class="hero-image"><img src="images/archive-rack-1600.webp" srcset="images/archive-rack-800.webp 800w, images/archive-rack-1600.webp 1600w" sizes="(max-width: 600px) calc(100vw - 32px), (max-width: 1344px) calc(100vw - 64px), 1280px" alt="Racks of vintage shirts and jackets on wooden hangers inside a clothing shop." width="1600" height="1000" fetchpriority="high"><figcaption class="image-credit">Editorial reference, not FORM inventory or premises. Photo by <a href="https://unsplash.com/@chungj07">Long Chung</a> / <a href="https://unsplash.com/photos/vintage-clothing-displayed-on-racks-in-a-store-6tih6odK1Do">Unsplash</a> · <a href="https://unsplash.com/license">Unsplash License</a></figcaption></figure>
        <div class="hero-copy"><h1 id="hero-title">Designer Archive</h1><!-- INLINE CSS: one-off tracking for this home-only promotional tagline. -->
        <p class="brand-tagline" style="letter-spacing: 0.02em;">Worth another wear.</p><a class="hero-collection-link" href="category-1.html">View collection</a></div>
      </section>
      <p class="store-intro home-intro">FORM brings together designer clothing with distinctive silhouettes, unexpected materials and considered construction.</p>

    </div>
  </main>
  <footer class="site-footer"><div class="wrap footer-inner"><p>Concept store. Items are not for sale.</p></div></footer>
</body>
</html>
